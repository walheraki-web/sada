name: Build Sada APK

# يبني ملف APK في سحابة GitHub عند كل رفع، أو يدويًا من تبويب Actions.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Run sync-engine tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sada-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ينشر الـ APK في إصدار «latest» برابط تحميل مباشر ثابت (فرع main فقط).
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk sada.apk
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest sada.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sada (آخر نسخة)" \
            --notes "رابط تحميل مباشر لأحدث APK. يُحدَّث تلقائيًا مع كل بناء."
